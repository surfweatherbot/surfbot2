name: Automatisk oppdatering av surf- og værdata

on:
  schedule:
    # Kjører hver time (f.eks. 08:00, 09:00, osv.)
    - cron: '0 * * * *'
  # Gjør det mulig å starte skriptene manuelt fra GitHub-grensesnittet
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Kjør alle Python-skript
        run: |
          # Endre disse linjene til de faktiske navnene på dine .py-filer
          python weather_script.py
          python surf_script.py
          python water_temp_script.py
          python wave_script.py

      - name: Lagre og push endrede .js-filer til GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.js
          git status
          git commit -m "Auto-oppdatering av .js data [skip ci]" || exit 0
          git push
