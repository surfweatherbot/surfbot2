name: Automatisk oppdatering av surf- og værdata

on:
  schedule:
    # Kjører én gang i timen (f.eks. kl 01:00, 02:00, 03:00 osv.)
    - cron: '0 * * * *'
  # Gjør det mulig å starte oppdateringen manuelt fra Actions-fanen på GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Kjør Python-skript
        run: |
          python bølge.py
          python dager_sf.py
          python timer_sf.py
          python vanntemp.py
          python yr_dager.py
          python yr_timer.py

      - name: Push oppdaterte .js-filer til GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.js
          git status
          git commit -m "Auto-oppdatering av .js data [skip ci]" || exit 0
          git push
