name: Oppdater Surf- og Værdata

on:
  schedule:
    # Kjører automatisk hver time (kl. 00:00, 01:00, 02:00, etc.)
    - cron: '0 * * * *'
  workflow_dispatch: # Gjør det mulig å starte skriptet manuelt fra GitHub Actions-fanen

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Gi skrivetilgang slik at boten kan pushe endringer

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer Python-pakker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installer Playwright Browsers og avhengigheter
        run: |
          python -m playwright install --with-deps chromium

      - name: Kjør hovedskriptet
        run: |
          python hovedscript.py

      - name: Commit og push oppdaterte .js-filer
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.js
          
          # Sjekk om det er noen endringer i JS-filene før commit
          if git diff --staged --quiet; then
            echo "Ingen endringer i .js-filene. Hopper over commit."
          else
            git commit -m "Auto-oppdatering av surf- og værdata [skip ci]"
            git push
          fi
